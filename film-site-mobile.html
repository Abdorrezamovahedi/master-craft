<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<title>ABDORREZA MASTER CRAFT 12</title>

<style>
/* ===== پایه ===== */
body{
    font-family: 'Lalezar', cursive;
    background-color: black;
    margin:0;
    padding:0;
    color: #00ff00;
}

/* لینک‌ها */
.a{
    color: #00ff00;
    transition: all 0.3s ease-in-out;
    background-color: rgb(0, 24, 1);
    font-size: 40px;
    width: fit-content;
    border-radius: 40px;
    text-decoration: none;
    padding: 10px 20px;
    display: inline-block;
}

.a:hover{
    box-shadow: 0 0 20px rgb(43, 77, 36);
    font-size: 50px;
    border: 2px solid rgb(0, 255, 13);
    background-color: #003b00;
    text-shadow: -10px -10px 3px black,1px -1px 0 black,-1px 1px 0 black,1px 1px 0 black;
}

img{
    margin: 0 auto;
    display: block;
    box-shadow: #003b00 0px 0px 20px 0px;
    width: 400px;
}

.a2{
    text-align:center;
    color: #00ff00;
    font-size: 50px;
}

.text{
    color: red;
    text-align: center;
    font-size: 50px;
}

/* ===== منوی موبایل سه خط ===== */
.mobile-nav{
    position: relative;
    z-index: 1000;
}

.hamburger{
    width: 40px;
    margin: 15px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 30px;
}

.hamburger span{
    display: block;
    height: 4px;
    background: red;
    border-radius: 5px;
    transition: 0.3s;
}

/* ===== انیمیشن تبدیل همبرگر به ضربدر ===== */
.hamburger.active span:nth-child(1){
    transform: rotate(45deg) translate(7px, 7px);
}
.hamburger.active span:nth-child(2){
    opacity: 0;
}
.hamburger.active span:nth-child(3){
    transform: rotate(-45deg) translate(8px, -8px);
}

/* منوی لینک‌ها */
.menu-links{
    display: none;
    text-align: center;
    flex-direction: column;
    background: black;
    padding: 10px 0;
    border-radius: 20px;
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.menu-links.active{
    display: flex;
    animation: slideDown 0.3s ease-in-out;
}

.menu-links a{
    display: block;
    margin: 10px auto;
    font-size: 24px;
    text-decoration: none;
    color: #00ff00;
}

/* انیمیشن */
@keyframes slideDown{
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* ===== موبایل فرندلی ===== */
@media (max-width: 768px){

    .a, .a2{
        font-size: 24px;
        margin: 10px auto;
    }

    .text{
        font-size: 22px;
    }

    img{
        width: 90%;
        max-width: 300px;
    }

    table, tr, td{
        display: block;
        width: 100%;
        text-align: center;
    }
}
</style>
</head>

<body>

<!-- منوی سه خط موبایل -->
<div class="mobile-nav">
    <div class="hamburger" onclick="toggleMenu(this)">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="menu-links" id="menuLinks">
        <a class="a" href="index.html">🏠 خانه</a>
        <a class="a" href="master-code/code-master.html">💻 مستر کد</a>
        <a class="a" href="coments.html">📞 ارتباط و چت با مخاطبان سایت</a>
    </div>
</div>

<div>
    <img class="img" src="films/img3.jpg">
    <br>
    <p class="text">MASTER CODE</p>
    <a href="https://aparat.com/v/zngavp5">
        <p class="a2">تماشا</p>
    </a>
</div>
<br>
<hr>
<br>
<div>
    <img class="img" src="films/img5.jpg">
    <br>
    <p class="text">2MASTER CODE</p>
    <a href="https://rubika.ir/joinc/ECHDIEJG0RRUCFFIRWWHTTSBFUYFHBGZ">
        <p class="a2">تماشا</p>
    </a>
</div>

<script>
function toggleMenu(el) {
    const menu = document.getElementById("menuLinks");
    menu.classList.toggle("active");
    el.classList.toggle("active"); // برای انیمیشن همبرگر
}
</script>

</body>
</html>
