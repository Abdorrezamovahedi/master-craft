<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کامنت زنده حرفه‌ای موبایل</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="coment/coments.css">
</head>
<body>
    

<h1>کامنت زنده موبایل</h1>

<form id="commentForm">
  <input type="text" id="name" placeholder="نام شما" required>
  <textarea id="message" placeholder="پیام شما" rows="3" required></textarea>
  <button type="submit">ارسال نظر</button>
</form>

<div id="comments"></div>

<script>
// ===== فقط نمایش در موبایل =====
if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
    document.body.style.display = 'block';
} else {
    document.body.innerHTML = "<h2 style='text-align:center;color:#fff;margin-top:50px;'>این صفحه فقط برای موبایل قابل مشاهده است</h2>";
}

// ===== تنظیمات Firebase =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== پر کردن نام از localStorage =====
const nameInput = document.getElementById('name');
if(localStorage.getItem('username')){
  nameInput.value = localStorage.getItem('username');
}

// ===== ارسال نظر =====
const form = document.getElementById('commentForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  const name = nameInput.value.trim();
  const message = document.getElementById('message').value.trim();
  
  if(name && message){
    localStorage.setItem('username', name);
    const newCommentRef = db.ref('comments').push();
    newCommentRef.set({
      name: name,
      message: message,
      timestamp: Date.now()
    });
    document.getElementById('message').value = '';
  }
});

// ===== نمایش کامنت‌ها =====
const commentsDiv = document.getElementById('comments');
db.ref('comments').orderByChild('timestamp').on('child_added', function(snapshot){
  const data = snapshot.val();
  const div = document.createElement('div');
  div.classList.add('comment');
  
  const date = new Date(data.timestamp);
  const timeStr = date.toLocaleString('fa-IR', { hour12: false });
  
  div.innerHTML = `<b>${data.name}</b>: ${data.message}<small>${timeStr}</small>`;
  commentsDiv.prepend(div); // جدیدترین بالا
  
  // انیمیشن ورود نرم
  setTimeout(()=> div.classList.add('show'), 50);
});
</script>

</body>
</html>
