<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود / ثبت نام</title>
  <meta name="color-scheme" content="only light">
  <link rel="icon" href="../../login/e.png"/>
  <link rel="stylesheet" href="login-mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function toggleMenu() {
        const menu = document.getElementById('menu');
        const toggle = document.querySelector('.menu-toggle');
        menu.classList.toggle('show');
        toggle.classList.toggle('open');
    }
  </script>
</head>
<body>
<div class="menu-toggle" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="menu" id="menu">
    <a class="a" href="../home-mobile/index-mobile.html">🏠 خانه</a>
    <a class="a" href="../aparat-mobile/aparat-mobile.html">🍏 آپارات</a>
    <a class="a" href="../films-mobile/film-site-mobile.html">🎞 فیلم سینمایی</a>
    <a class="a" href="../master-code-mobile/master-code-mobile.html">💻 مستر کد</a>
    <a class="a" href="../mt-mobile/mt-mobile.html">🎈محل تبلیغات</a>
    <a class="a" href="../../panel/panel.html">👤 پنل کاربری</a>
</div>

<div class="login-box">
  <h2>ورود / ثبت نام</h2>

  <form id="loginForm">
    <label>نام کاربری</label>
    <input type="text" name="username" required>

    <label>شماره موبایل</label>
    <input type="tel" name="phone" placeholder="09xxxxxxxxx" inputmode="numeric" required>

    <label>ایمیل</label>
    <input type="email" name="email" required>

    <label>رمز عبور</label>
    <input type="password" name="password" required>

    <button type="submit">ورود</button>
  </form>
</div>

<script>
const form = document.getElementById("loginForm");
const SUPABASE_URL = "https://pvudxnmwgdkfccdzaabm.supabase.co";
const SUPABASE_KEY = "sb_publishable_H7920EdFQ6SAz5rou2x3ng__C9uAwRF";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function toEnglishDigits(str) {
  return str.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

async function saveOrUpdateUser(user) {
  // اول بررسی کن کاربر با همین شماره هست یا نه
  const { data: existingUser, error: selectError } = await supabaseClient
    .from("users")
    .select("id")
    .eq("phone", user.phone)
    .limit(1);

  if (selectError) {
    console.error("Select error:", selectError);
    alert("خطا هنگام بررسی کاربر: " + selectError.message);
    return;
  }

  if (existingUser && existingUser.length) {
    // آپدیت کاربر موجود
    const { data, error } = await supabaseClient
      .from("users")
      .update({
        username: user.username,
        email: user.email,
        last_login: user.lastLogin
      })
      .eq("phone", user.phone);

    if (error) {
      console.error("Update error:", error);
      alert("خطا هنگام به‌روزرسانی کاربر: " + error.message);
    } else {
      console.log("کاربر آپدیت شد:", data);
    }
  } else {
    // ایجاد کاربر جدید
    const { data, error } = await supabaseClient
      .from("users")
      .insert({
        username: user.username,
        phone: user.phone,
        email: user.email,
        last_login: user.lastLogin
      });

    if (error) {
      console.error("Insert error:", error);
      alert("خطا هنگام ثبت نام: " + error.message);
    } else {
      console.log("کاربر جدید ثبت شد:", data);
    }
  }
}

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  let phone = toEnglishDigits(form.phone.value.trim());

  if (!/^09\d{9}$/.test(phone)) {
    alert("شماره موبایل معتبر نیست\nمثال: 09123456789");
    return;
  }

  form.phone.value = phone;

  const userRecord = {
    username: form.username.value.trim(),
    phone: form.phone.value.trim(),
    email: form.email.value.trim(),
    lastLogin: new Date().toISOString()
  };

  await saveOrUpdateUser(userRecord);

  localStorage.setItem("profile_name", form.username.value.trim());
  localStorage.setItem("profile_phone", form.phone.value.trim());
  localStorage.setItem("profile_email", form.email.value.trim());
  localStorage.setItem("isLoggedIn", "true");

  location.replace("../home-mobile/index-mobile.html");
});
</script>

</body>
</html>
